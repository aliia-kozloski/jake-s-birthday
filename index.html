<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jake's Birthday Week — A Star Wars Story</title>
  <meta name="description" content="Seven days. Seven doors. One legendary birthday boy. August 24–30.">
  <meta name="theme-color" content="#05070d">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Pathway+Gothic+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- background layers -->
  <canvas id="starfield" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="deathstar" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none">
      <circle cx="100" cy="100" r="96"/>
      <circle cx="64" cy="58" r="24"/>
      <circle cx="64" cy="58" r="12"/>
      <path d="M4 118h192"/>
      <path d="M4 128h192" opacity=".5"/>
      <path d="M30 40h24M140 36h30M118 74h40M28 88h20" opacity=".4"/>
      <path d="M40 150h36M96 162h44M140 142h28" opacity=".4"/>
    </svg>
  </div>

  <div class="xwing" aria-hidden="true">
    <svg viewBox="0 0 64 64">
      <path d="M32 4l3 22 19-11 3 5-18 12 18 12-3 5-19-11-3 22h-4l3-22-19 11-3-5 18-12-18-12 3-5 19 11 3-22z"/>
    </svg>
  </div>

  <div id="previewBanner" class="preview-banner" hidden></div>

  <!-- page -->
  <div class="page">
    <header class="site-head">
      <p class="eyebrow" id="eyebrow"></p>
      <div class="head-row">
        <h1 class="logo" id="logo"></h1>
        <div class="hero-figure" id="heroFigure" hidden>
          <span class="hero-figure__stage"><img id="heroFigureImg" alt=""></span>
          <span class="chip chip--hero" id="heroFigureLabel"></span>
        </div>
      </div>
      <p class="dates" id="datesLabel"></p>
      <p class="status" id="statusLine"></p>
      <div class="cd cd--hero" id="heroCountdown" hidden></div>
    </header>

    <main>
      <section class="doors" id="doors" aria-label="Birthday week calendar"></section>
    </main>

    <footer class="site-foot">
      <div class="saber-divider" aria-hidden="true"><span class="saber-divider__hilt"></span><span class="saber-divider__blade"></span></div>
      <p id="footerText"></p>
      <button class="btn btn--ghost" id="replayIntro" type="button">↺ Replay opening crawl</button>
    </footer>
  </div>

  <!-- day modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" id="modalBackdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__close" id="modalClose" type="button" aria-label="Close">✕</button>
      <div class="modal__head">
        <div class="modal__chips" id="modalChips"></div>
        <h2 class="modal__title" id="modalTitle"></h2>
        <p class="modal__tag" id="modalTag"></p>
        <div class="saber-divider" aria-hidden="true"><span class="saber-divider__hilt"></span><span class="saber-divider__blade"></span></div>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <!-- photo lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox__backdrop" id="lightboxBackdrop"></div>
    <button class="lightbox__close" id="lightboxClose" type="button" aria-label="Close photo">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" type="button" aria-label="Previous photo">‹</button>
    <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" type="button" aria-label="Next photo">›</button>
    <figure class="lightbox__figure">
      <img id="lightboxImg" alt="">
      <figcaption id="lightboxCap"></figcaption>
    </figure>
  </div>

  <!-- opening crawl -->
  <div class="intro" id="intro" hidden>
    <div class="intro__pre" id="introPre"></div>
    <div class="intro__logowrap"><div class="intro__logo" id="introLogo"></div></div>
    <div class="intro__crawlwrap"><div class="intro__crawl" id="introCrawl"></div></div>
    <button class="intro__skip" id="introSkip" type="button">SKIP ▸</button>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="content.js"></script>
  <script src="main.js"></script>
</body>
</html>
